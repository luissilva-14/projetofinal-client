<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="form_login">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="seuemail@gmail.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>

            <p class="link-cadastro">Não possui cadastro? <a href="./cadastro.html">Cadastre-se aqui</a></p>

            <input type="submit" value="Entrar" class="btn_enviar">
        </form>
    </div>

    <script>
        const form = document.getElementById("form_login")

        form.addEventListener("submit", async (event) => {
            event.preventDefault()

            const dados = {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }

            try {
                const resposta = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                })

                const resultado = await resposta.json()

                if (!resposta.ok) {
                    throw new Error(resultado.msg || resultado.erro || "Erro no login")
                }

                // Salva no localStorage
                localStorage.setItem("nome_cliente", resultado.nome)
                localStorage.setItem("token", resultado.token)

                alert("Login realizado com sucesso! Olá, " + resultado.nome)
                // window.location.href = "perfil.html"  // se tiver página de perfil
            } catch (error) {
                alert("Erro: " + error.message)
            }
        })
    </script>
</body>
</html>
