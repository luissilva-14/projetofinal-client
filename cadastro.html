<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>
<body>
    <div class="container">
        <h1>Cadastro de clientes</h1>
        <form id="form_cadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome aqui" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="(42) 91234-5678" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="seuemail@gmail.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>

            <p class="link-cadastro">Já possui conta? <a href="./login.html">Fazer login</a></p>

            <input type="submit" id="btn_enviar" value="Cadastrar" class="btn_enviar">
        </form>
    </div>

    <script>
        function pegar_dados() {
            return {
                nome: document.getElementById("nome").value,
                celular: document.getElementById("celular").value,
                cpf: document.getElementById("cpf").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
        }

        const form = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")

        form.addEventListener("submit", async (event) => {
            event.preventDefault()
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando..."

            const dados = pegar_dados()

            try {
                const resposta = await fetch("http://localhost:3000/cliente", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                })

                const resultado = await resposta.json()

                if (!resposta.ok) {
                    throw new Error(resultado.erro || resultado.msg || "Erro na API")
                }

                alert("Cadastro realizado com sucesso!")
                form.reset()
                window.location.href = "login.html"
            } catch (error) {
                alert("Erro: " + error.message)
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Cadastrar"
            }
        })
    </script>
</body>
</html>
